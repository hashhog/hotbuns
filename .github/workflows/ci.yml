name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install
      # libsecp256k1 is not preinstalled on the runner, but the crypto test
      # suite requires the FFI backend (~208 tests). Build it from source;
      # the FFI loader (src/crypto/secp256k1_ffi.ts) probes
      # .so.2/.so.6/.so.5/.so.1/.so.0/.so, so any installed soname is found.
      - name: Install libsecp256k1 from source
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool build-essential
          git clone --depth 1 --branch v0.7.1 https://github.com/bitcoin-core/secp256k1 /tmp/secp256k1
          cd /tmp/secp256k1
          ./autogen.sh
          ./configure
          make -j
          sudo make install
          sudo ldconfig
      - run: bun test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install
      - run: bun run typecheck

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: hotbuns:${{ github.sha }}
